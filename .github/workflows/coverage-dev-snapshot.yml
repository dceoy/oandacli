name: Coverage development source snapshot
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package source
        run: tar -czf /tmp/oandactl-source.tar.gz --exclude=.git .
      - name: Upload source snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-source-snapshot
          path: /tmp/oandactl-source.tar.gz
          retention-days: 1
