---
name: Release
on:
  workflow_dispatch:  # checkov:skip=CKV_GHA_7:workflow_dispatch inputs are required for release parameters
    inputs:
      tag-name:
        required: false
        type: string
        description: Explicit version tag (use v0.1.0 for the first release)
      version-bump:
        required: false
        type: choice
        description: SemVer increment for the new tag
        default: auto
        options:
          - auto
          - major-release
          - minor-release
          - patch-release
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate-input:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate explicit version
        env:
          RELEASE_TAG: ${{ inputs.tag-name }}
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::tag-name must be a stable version such as v0.1.0'
            exit 1
          fi
  go-package-release:
    needs: validate-input
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/go-package-release-on-github.yml@a87389a0f8e98a256ca1f1047d5178600b164535
    with:
      tag-name: ${{ inputs.tag-name }}
      create-new-tag: true
      version-bump: ${{ inputs.version-bump }}
      main-package: .
      binary-name: oandactl
      version-variable: github.com/dceoy/oandactl/internal/cli.Version
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
